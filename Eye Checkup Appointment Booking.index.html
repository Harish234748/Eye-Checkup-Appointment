<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Eye Checkup Booking</title>
<style>
:root{--bg:#fff;--fg:#10263a;--mut:#5b7083;--bl:#1565c0;--tl:#0f9d9a;--ln:#d9e3ec;--sf:#f3f8fc;--er:#c62828;--ok:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a26;--fg:#e6eef6;--mut:#9bb0c2;--bl:#5aa5f5;--tl:#35c4c0;--ln:#274055;--sf:#152636;--er:#ff7b7b;--ok:#6fcf74}}
:root[data-theme=dark]{--bg:#0e1a26;--fg:#e6eef6;--mut:#9bb0c2;--bl:#5aa5f5;--tl:#35c4c0;--ln:#274055;--sf:#152636;--er:#ff7b7b;--ok:#6fcf74}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 20px}header b{color:var(--bl);font-size:18px;margin-right:auto}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--fg);cursor:pointer;font:inherit}nav button.on{background:var(--sf);color:var(--bl);font-weight:600}
main{max-width:980px;margin:0 auto;padding:20px}h1,h2,h3,h4{margin:.4em 0}.mut{color:var(--mut)}small{color:var(--mut)}
.hero{background:linear-gradient(135deg,var(--bl),var(--tl));color:#fff;border-radius:16px;padding:32px 24px}.hero h1{font-size:clamp(24px,5vw,38px)}
.btn{background:var(--bl);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}.btn.t{background:var(--tl)}.btn.o{background:none;color:var(--bl);border:1px solid var(--bl)}.btn.w{background:#fff;color:var(--bl)}.btn:disabled{opacity:.5}.btn.s{padding:5px 10px;font-size:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:16px 0}.card{border:1px solid var(--ln);border-radius:14px;padding:16px;background:var(--bg)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}input:focus,select:focus,textarea:focus{outline:2px solid var(--tl)}
.err{color:var(--er);font-size:13px;min-height:0}.row{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.cal .ch{display:flex;justify-content:space-between;align-items:center}.cal .ch button{border:1px solid var(--ln);background:none;color:var(--fg);border-radius:8px;width:36px;height:36px;cursor:pointer}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center}.day,.t{border:1px solid var(--ln);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 0;cursor:pointer;font:inherit}.day:disabled,.t:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}.day.on,.t.on{background:var(--tl);color:#fff;border-color:var(--tl)}
.ts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.warn{background:#fff7e0;color:#5c4400;border:1px solid #f0d78a;border-radius:10px;padding:10px 14px;margin:12px 0;font-size:14px}.ok{color:var(--ok)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--ln);white-space:nowrap}
.pill{padding:2px 9px;border-radius:99px;background:var(--sf);font-size:12px;font-weight:600}.pill.confirmed{color:var(--bl)}.pill.completed{color:var(--ok)}.pill.cancelled,.pill.no-show{color:var(--er)}
.tabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.num{font-size:28px;font-weight:700;color:var(--bl)}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#modal>div{background:var(--bg);border-radius:14px;padding:18px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
</style></head><body>
<header><b id="brand">Eye Clinic</b><nav id="nav"></nav></header><main id="main"></main><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),D=x=>typeof x.data==='function'?x.data():x.data;
const DEF={name:"ClearView Eye Clinic",addr:"12 Lake Road, Navrangpura, Ahmedabad 380009",phone:"+91 79 5550 0100",email:"hello@clearview.example",open:"09:00",close:"17:00",slot:30,days:[1,2,3,4,5,6],holidays:["2026-10-20"],cutoffH:24,
doctors:[{id:"d1",name:"Dr. Asha Mehta",days:[1,2,3,4,5]},{id:"d2",name:"Dr. Rohan Shah",days:[2,4,6]}]};
const TYPES=["Routine eye checkup","Vision test","Glasses prescription","Follow-up visit"],STS=["confirmed","completed","cancelled","no-show"],DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const S={cfg:DEF,slots:{},appts:[],mine:[],db:null,uid:null,admin:false,view:'home',conf:null,draws:[],f:{q:'',date:'',doc:'',st:''},at:'list'};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const tf=t=>{const h=+t.slice(0,2);return(h%12||12)+t.slice(2)+(h<12?' AM':' PM')},df=s=>pd(s).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const dn=id=>(S.cfg.doctors.find(d=>d.id===id)||{name:id}).name,key=(d,date,t)=>d+'_'+date+'_'+t.replace(':','');
function times(date,did){const c=S.cfg,d=pd(date).getDay(),doc=c.doctors.find(x=>x.id===did);if(!doc||c.holidays.includes(date)||!c.days.includes(d)||!doc.days.includes(d))return[];
 const[a,b]=c.open.split(':').map(Number),[e,f]=c.close.split(':').map(Number),o=[];for(let t=a*60+b;t+c.slot<=e*60+f;t+=c.slot)o.push(String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0'));return o}
const free=(did,date,t)=>!S.slots[key(did,date,t)]&&pd(date).setHours(+t.slice(0,2),+t.slice(3))>Date.now();
function picker(el,getDoc,sel,onPick){let m=new Date();m.setDate(1);
 const draw=()=>{const did=getDoc(),y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate(),today=ymd(new Date());let g='';for(let i=0;i<first;i++)g+='<i></i>';
  for(let d=1;d<=n;d++){const s=ymd(new Date(y,mo,d)),ok=s>=today&&times(s,did).some(t=>free(did,s,t));g+=`<button type=button class="day${sel.date===s?' on':''}" data-d="${s}" ${ok?'':'disabled'}>${d}</button>`}
  let ts='<p class=mut>Pick a date to view available slots.</p>';if(sel.date){const l=times(sel.date,did);ts=l.length?'<div class=ts>'+l.map(t=>`<button type=button class="t${sel.time===t?' on':''}" data-t="${t}" ${free(did,sel.date,t)?'':'disabled'}>${tf(t)}</button>`).join('')+'</div>':'<p class=mut>No slots on this date.</p>'}
  el.innerHTML=`<div class=cal><div class=ch><button type=button data-n=-1 aria-label="Previous month">‹</button><b>${m.toLocaleString('en',{month:'long',year:'numeric'})}</b><button type=button data-n=1 aria-label="Next month">›</button></div><div class=g>${DN.map(x=>'<small>'+x[0]+'</small>').join('')}${g}</div></div><h4>Available time slots</h4>${ts}`};
 el.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.n){m.setMonth(m.getMonth()+ +b.dataset.n);draw()}else if(b.dataset.d){sel.date=b.dataset.d;sel.time='';draw();onPick&&onPick()}else if(b.dataset.t){sel.time=b.dataset.t;draw();onPick&&onPick()}};
 draw();S.draws.push(draw);return draw}
async function claim(did,date,t,id){const r=S.db.doc('slots/'+key(did,date,t)),a=await r.acquire({ttlMs:5000});if(!a.acquired)return false;const s=await r.get();if(s.exists&&D(s).appt!==id)return false;await r.set({appt:id,doctor:did,date,time:t});return true}
const rel=(did,date,t)=>S.db.doc('slots/'+key(did,date,t)).delete();
const patch=(a,p)=>S.db.doc('appts/'+(a.uid||S.uid)).update({items:{[a.id]:p}});
async function setSt(a,st){if(st==='cancelled'&&a.st!=='cancelled')await rel(a.doctor,a.date,a.time);if(a.st==='cancelled'&&st!=='cancelled'&&!await claim(a.doctor,a.date,a.time,a.id))return alert('That slot has since been taken.');await patch(a,{st})}
async function move(a,date,time,doctor){if(!await claim(doctor,date,time,a.id))return false;if(a.st!=='cancelled'&&(a.doctor!==doctor||a.date!==date||a.time!==time))await rel(a.doctor,a.date,a.time);await patch(a,{date,time,doctor,st:'confirmed'});return true}
function modal(h){const m=$('#modal');m.innerHTML='<div>'+h+'</div>';m.style.display='flex';m.onclick=e=>{if(e.target===m)closeM()}}const closeM=()=>{$('#modal').style.display='none'};
function nav(){const v=[['home','Home'],['book','Book an Eye Checkup'],['mine','My Bookings']];if(S.admin)v.push(['admin','Staff Dashboard']);$('#nav').innerHTML=v.map(([k,l])=>`<button data-v="${k}" class="${S.view===k?'on':''}">${l}</button>`).join('');$('#brand').textContent='👁 '+S.cfg.name}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};const go=v=>{S.view=v;render();scrollTo(0,0)};
function render(){S.draws=[];nav();({home,book,mine,admin,conf}[S.view]||home)()}
const refresh=()=>{if(S.view==='book')S.draws.forEach(f=>f());else if(S.view!=='conf')render();else nav()};
const dbWarn=()=>S.db&&S.uid?'':'<div class=warn><b>Database not connected.</b> Open this page signed in to claude.ai (as a Contributor or above) to book. Viewing only.</div>';
function home(){const c=S.cfg;$('#main').innerHTML=`<div class=hero><h1>Clear vision starts with a quick checkup</h1><p>Book a routine eye test, glasses prescription or follow-up online in under a minute.</p><button class="btn w" onclick="go('book')">Book an Eye Checkup</button> <button class="btn w" style="background:none;color:#fff;border:1px solid #fff" onclick="go('book')">View Available Slots</button></div>
<div class=grid><div class=card><h3>📍 Visit us</h3><p>${esc(c.addr)}</p></div><div class=card><h3>🕘 Opening hours</h3><p>${c.days.map(d=>DN[d]).join(', ')}<br>${tf(c.open)} – ${tf(c.close)}</p><small>Closed: ${c.holidays.length?c.holidays.map(df).join('; '):'no holidays set'}</small></div><div class=card><h3>📞 Contact</h3><p>${esc(c.phone)}<br>${esc(c.email)}</p></div></div>
<div class=card><h3>Our doctors</h3>${c.doctors.map(d=>`<p>${esc(d.name)} <small>${d.days.map(x=>DN[x]).join(', ')}</small></p>`).join('')}<small>Changes or cancellations are allowed up to ${c.cutoffH} hours before your appointment.</small></div>${dbWarn()}`}
function book(){const c=S.cfg,sel={date:'',time:''};const fl=(l,i,id)=>`<label for="${id}">${l}</label>${i}<div class=err id="e_${id}"></div>`;
 $('#main').innerHTML=`<h2>Book an Eye Checkup</h2>${dbWarn()}<form id=f class=card novalidate><div class=row><div>${fl('Full name *','<input id=name name=name autocomplete=name>','name')}</div><div>${fl('Mobile number *','<input id=phone name=phone type=tel inputmode=tel autocomplete=tel placeholder="10-digit number">','phone')}</div>
 <div>${fl('Email (optional)','<input id=email name=email type=email autocomplete=email>','email')}</div><div>${fl('Age *','<input id=age name=age type=number min=1 max=120>','age')}</div>
 <div>${fl('Preferred eye doctor','<select id=doctor name=doctor>'+c.doctors.map(d=>`<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('')+'</select>','doctor')}</div><div>${fl('Type of appointment','<select name=type id=type>'+TYPES.map(t=>`<option>${t}</option>`).join('')+'</select>','type')}</div></div>
 <label>Preferred date &amp; time *</label><div id=pk></div><div class=err id=e_slot></div>${fl('Additional notes (optional)','<textarea name=notes id=notes rows=2 maxlength=300></textarea>','notes')}<p><button class=btn id=sub>Confirm Appointment</button></p><div class=err id=e_form></div></form>`;
 const draw=picker($('#pk'),()=>$('#doctor').value,sel);$('#doctor').onchange=()=>{sel.date=sel.time='';draw()};
 $('#f').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),er={};document.querySelectorAll('.err').forEach(x=>x.textContent='');
  if(v.name.trim().length<2)er.name='Please enter your full name.';const ph=v.phone.replace(/[\s-]/g,'').replace(/^(\+91|0)/,'');if(!/^[6-9]\d{9}$/.test(ph))er.phone='Enter a valid 10-digit mobile number.';
  if(v.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email))er.email='Enter a valid email address.';if(!(+v.age>=1&&+v.age<=120))er.age='Enter an age between 1 and 120.';if(!sel.date||!sel.time)er.slot='Please choose a date and time slot.';
  for(const k in er)$('#e_'+k).textContent=er[k];if(Object.keys(er).length)return;if(!S.db||!S.uid)return $('#e_form').textContent='Database not connected, so booking is unavailable.';
  const id='EC-'+Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join(''),a={id,name:v.name.trim(),phone:ph,email:v.email.trim(),age:+v.age,doctor:v.doctor,type:v.type,date:sel.date,time:sel.time,notes:v.notes.trim(),st:'confirmed',created:Date.now()};
  $('#sub').disabled=true;try{if(!await claim(a.doctor,a.date,a.time,id)){$('#e_form').textContent='Sorry, that slot was just taken. Please choose another.';sel.time='';draw();$('#sub').disabled=false;return}
   const r=S.db.doc('appts/'+S.uid),s=await r.get();s.exists?await r.update({items:{[id]:a}}):await r.set({items:{[id]:a}});S.conf=a;go('conf')}catch(x){await rel(a.doctor,a.date,a.time).catch(()=>{});$('#e_form').textContent='Could not save the booking ('+(x.message||x.code)+'). Please try again.';$('#sub').disabled=false}}}
function conf(){const a=S.conf,c=S.cfg;if(!a)return go('home');$('#main').innerHTML=`<div class=card><h2 class=ok>✔ Appointment confirmed</h2><p>Your appointment ID: <b style="font-size:22px;color:var(--bl)">${a.id}</b></p><p><b>${df(a.date)}</b> at <b>${tf(a.time)}</b><br>${esc(dn(a.doctor))} · ${esc(a.type)}<br>${esc(c.name)}, ${esc(c.addr)}<br>${esc(c.phone)}</p>
 <div class=warn>SMS / email confirmations are <b>not connected</b> in this build, so no message was sent. Please save your appointment ID. See setup notes to connect a messaging service.</div><button class=btn onclick="go('mine')">View / change my booking</button> <button class="btn o" onclick="go('home')">Back to home</button></div>`}
const mineList=()=>[...S.mine].sort((a,b)=>b.created-a.created);
function mine(){const L=mineList(),c=S.cfg;$('#main').innerHTML=`<h2>My Bookings</h2>${dbWarn()}<p class=mut>Bookings made from this account. Changes are allowed up to ${c.cutoffH} hours before the appointment.</p>`+(L.length?L.map(a=>{const ok=a.st==='confirmed'&&pd(a.date).setHours(+a.time.slice(0,2),+a.time.slice(3))-Date.now()>c.cutoffH*36e5;
 return`<div class=card style="margin-bottom:12px"><b>${a.id}</b> <span class="pill ${a.st}">${a.st}</span><p>${df(a.date)} · ${tf(a.time)}<br>${esc(dn(a.doctor))} · ${esc(a.type)}</p>${ok?`<button class="btn s" data-rs="${a.id}">Reschedule</button> <button class="btn s o" data-cx="${a.id}">Cancel</button>`:a.st==='confirmed'?'<small>Within the change window — please call the clinic.</small>':''}</div>`}).join(''):'<div class=card>No bookings yet.</div>');
 $('#main').onclick=async e=>{const b=e.target.closest('button'),a=b&&L.find(x=>x.id===(b.dataset.rs||b.dataset.cx));if(!a)return;if(b.dataset.cx){if(confirm('Cancel this appointment?'))try{await setSt(a,'cancelled')}catch(x){alert(x.message)}}else resched(a)}}
function resched(a){const sel={date:'',time:''};modal(`<h3>Reschedule ${a.id}</h3><div id=pk2></div><div class=err id=em></div><p><button class="btn t" id=ok>Confirm new time</button> <button class="btn o" onclick="closeM()">Close</button></p>`);
 picker($('#pk2'),()=>a.doctor,sel);$('#ok').onclick=async()=>{if(!sel.time)return $('#em').textContent='Choose a date and time.';try{if(await move(a,sel.date,sel.time,a.doctor))closeM();else $('#em').textContent='That slot was just taken.'}catch(x){$('#em').textContent=x.message}}}
function admin(){if(!S.admin)return go('home');const t=S.at;$('#main').innerHTML=`<h2>Staff Dashboard</h2><div class=tabs>${[['list','Appointments'],['sum','Summary'],['set','Clinic settings']].map(([k,l])=>`<button class="btn s ${t===k?'':'o'}" data-t="${k}">${l}</button>`).join('')}</div><div id=ab></div>`;
 $('#main').onclick=e=>{const b=e.target.closest('[data-t]');if(b){S.at=b.dataset.t;admin()}};({list:aList,sum:aSum,set:aSet}[t])()}
function aList(){const f=S.f;$('#ab').innerHTML=`<div class=row style="gap:8px"><input id=fq placeholder="Search name, phone or ID" value="${esc(f.q)}"><input id=fd type=date value="${f.date}"><select id=fo><option value="">All doctors</option>${S.cfg.doctors.map(d=>`<option value="${esc(d.id)}" ${f.doc===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select><select id=fs><option value="">All statuses</option>${STS.map(s=>`<option ${f.st===s?'selected':''}>${s}</option>`).join('')}</select></div><p><button class=btn id=add>+ Add appointment</button></p><div class=tw id=tb></div>`;
 const up=()=>{S.f={q:$('#fq').value,date:$('#fd').value,doc:$('#fo').value,st:$('#fs').value};tbl()};['fq','fd','fo','fs'].forEach(i=>$('#'+i).oninput=up);$('#add').onclick=()=>go('book');tbl()}
function tbl(){const f=S.f,q=f.q.toLowerCase(),L=S.appts.filter(a=>(!q||(a.name+a.phone+a.id).toLowerCase().includes(q))&&(!f.date||a.date===f.date)&&(!f.doc||a.doctor===f.doc)&&(!f.st||a.st===f.st)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 $('#tb').innerHTML=`<table><tr><th>ID<th>Patient<th>Phone<th>Date<th>Time<th>Doctor<th>Type<th>Status<th></tr>${L.map(a=>`<tr><td>${a.id}<td>${esc(a.name)} <small>(${a.age})</small><td>${esc(a.phone)}<td>${df(a.date)}<td>${tf(a.time)}<td>${esc(dn(a.doctor))}<td>${esc(a.type)}<td><select data-s="${a.id}">${STS.map(s=>`<option ${a.st===s?'selected':''}>${s}</option>`).join('')}</select><td><button class="btn s o" data-r="${a.id}">Reschedule</button></tr>`).join('')||'<tr><td colspan=9>No appointments match.</tr>'}</table>`;
 $('#tb').onchange=async e=>{const a=S.appts.find(x=>x.id===e.target.dataset.s);if(a)try{await setSt(a,e.target.value)}catch(x){alert(x.message)}};$('#tb').onclick=e=>{const a=S.appts.find(x=>x.id===e.target.dataset.r);if(a)resched(a)}}
function aSum(){const now=new Date(),mon=new Date(now);mon.setDate(now.getDate()-(now.getDay()+6)%7);const w=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return ymd(d)}),td=ymd(now),A=S.appts.filter(a=>a.st!=='cancelled'),W=A.filter(a=>w.includes(a.date)),T=A.filter(a=>a.date===td);
 $('#ab').innerHTML=`<div class=grid>${[['Today',T.length],['This week',W.length],['Completed (week)',W.filter(a=>a.st==='completed').length],['No-shows (week)',S.appts.filter(a=>w.includes(a.date)&&a.st==='no-show').length]].map(([l,n])=>`<div class=card><div class=num>${n}</div>${l}</div>`).join('')}</div>
 <div class="card tw"><h3>Week by doctor</h3><table><tr><th>Doctor${w.map(d=>'<th>'+DN[pd(d).getDay()]+' '+d.slice(8)).join('')}</tr>${S.cfg.doctors.map(d=>`<tr><td>${esc(d.name)}${w.map(x=>'<td>'+A.filter(a=>a.doctor===d.id&&a.date===x).length).join('')}</tr>`).join('')}</table></div>
 <div class=card><h3>Today's schedule</h3>${T.sort((a,b)=>a.time.localeCompare(b.time)).map(a=>`<p>${tf(a.time)} · ${esc(a.name)} · ${esc(dn(a.doctor))} · ${a.type}</p>`).join('')||'<p class=mut>Nothing booked today.</p>'}</div>`}
function aSet(){const c=S.cfg;$('#ab').innerHTML=`<form id=cf class=card><div class=row><div><label>Clinic name</label><input name=name value="${esc(c.name)}"></div><div><label>Phone</label><input name=phone value="${esc(c.phone)}"></div><div><label>Email</label><input name=email value="${esc(c.email)}"></div><div><label>Address</label><input name=addr value="${esc(c.addr)}"></div>
 <div><label>Opens</label><input type=time name=open value="${c.open}"></div><div><label>Closes</label><input type=time name=close value="${c.close}"></div><div><label>Slot length (min)</label><input type=number name=slot min=10 max=120 value="${c.slot}"></div><div><label>Change/cancel cutoff (hours)</label><input type=number name=cutoffH min=0 value="${c.cutoffH}"></div></div>
 <label>Open days</label>${DN.map((d,i)=>`<label style="display:inline-block;margin-right:10px;font-weight:400"><input type=checkbox name=days value=${i} ${c.days.includes(i)?'checked':''} style="width:auto"> ${d}</label>`).join('')}
 <label>Holidays (YYYY-MM-DD, comma-separated)</label><input name=hol value="${c.holidays.join(', ')}"><label>Doctors (one per line: id | name | working days 0=Sun…6=Sat)</label><textarea name=docs rows=4>${c.doctors.map(d=>d.id+' | '+d.name+' | '+d.days.join(',')).join('\n')}</textarea><div class=err id=ce></div>
 <p><button class=btn>Save settings</button> <button type=button class="btn o" id=demo>Add demo appointments</button></p></form>`;
 $('#cf').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),v=Object.fromEntries(fd),hol=v.hol.split(',').map(s=>s.trim()).filter(Boolean);
  const docs=v.docs.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(p=>p[0]&&p[1]).map(p=>({id:p[0].replace(/\W/g,''),name:p[1],days:(p[2]||'').split(',').map(Number).filter(n=>n>=0&&n<=6)}));
  if(hol.some(h=>!/^\d{4}-\d\d-\d\d$/.test(h))||!docs.length||!(+v.slot>=10))return $('#ce').textContent='Check holiday dates (YYYY-MM-DD), doctors list and slot length.';
  const n={name:v.name,phone:v.phone,email:v.email,addr:v.addr,open:v.open,close:v.close,slot:+v.slot,cutoffH:+v.cutoffH,days:fd.getAll('days').map(Number),holidays:hol,doctors:docs};
  try{await S.db.doc('config/clinic').set(n);$('#ce').textContent='Saved.'}catch(x){$('#ce').textContent=x.message}};
 $('#demo').onclick=async()=>{const nm=["Priya Nair","Karan Patel","Meera Joshi","Imran Qureshi","Sneha Desai","Vikram Rao"],items={};let i=0,d=new Date();
  for(let k=0;k<14&&i<nm.length;k++){d.setDate(d.getDate()+1);const s=ymd(d),doc=S.cfg.doctors[i%S.cfg.doctors.length],l=times(s,doc.id).filter(t=>free(doc.id,s,t));if(!l.length)continue;const t=l[(i*2)%l.length],id='EC-DEMO'+(i+1);
   if(await claim(doc.id,s,t,id)){items[id]={id,name:nm[i],phone:'98250000'+String(10+i),email:'',age:28+i*7,doctor:doc.id,type:TYPES[i%4],date:s,time:t,notes:'Demo booking',st:'confirmed',created:Date.now()-i};i++}}
  if(i){await S.db.doc('appts/demo').set({items:Object.assign({},(S.appts.filter(a=>a.uid==='demo').reduce((o,a)=>(o[a.id]=a,o),{})),items)});$('#ce').textContent=i+' demo appointments added.'}}}
(async()=>{render();const C=window.claude;if(!C)return;try{const u=await C.use('user');S.admin=!!(u&&u.canEdit());S.uid=u?await u.id():null;S.db=await C.use('db')}catch(e){}
 render();if(!S.db)return;const er=e=>console.warn(e);
 S.db.doc('config/clinic').onSnapshot(s=>{if(s.exists)S.cfg={...DEF,...D(s)};refresh()},er);
 S.db.collection('slots').onSnapshot(q=>{S.slots={};q.docs.forEach(d=>S.slots[d.id]=1);S.draws.forEach(f=>f())},er);
 if(S.admin)S.db.collection('appts').onSnapshot(q=>{S.appts=q.docs.flatMap(d=>Object.values((D(d)||{}).items||{}).map(i=>({...i,uid:d.id})));S.mine=S.appts.filter(a=>a.uid===S.uid);if(S.view==='admin'&&S.at==='list')tbl();else if(S.view!=='book'&&S.view!=='conf')render()},er);
 else if(S.uid)S.db.doc('appts/'+S.uid).onSnapshot(s=>{S.mine=s.exists?Object.values(D(s).items||{}):[];if(S.view==='mine')render()},er)})();
</script></body></html>
